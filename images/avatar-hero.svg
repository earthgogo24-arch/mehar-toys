<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bgHero)"/>
  <!-- Superhero Cape / Collar -->
  <path d="M40 200 L60 145 L140 145 L160 200 Z" fill="#F59E0B"/>
  <!-- Suit -->
  <path d="M50 200 C50 160 75 148 100 148 C125 148 150 160 150 200 Z" fill="#1E3A8A"/>
  <!-- Hero Star Emblem -->
  <polygon points="100,160 104,172 116,172 106,180 110,192 100,184 90,192 94,180 84,172 96,172" fill="url(#shieldGrad)"/>
  <!-- Neck -->
  <rect x="91" y="126" width="18" height="24" rx="5" fill="#FED7AA"/>
  <!-- Head -->
  <circle cx="100" cy="95" r="45" fill="#FED7AA"/>
  <!-- Ears -->
  <circle cx="55" cy="98" r="9" fill="#FDBA74"/>
  <circle cx="145" cy="98" r="9" fill="#FDBA74"/>
  <!-- Superhero Mask -->
  <path d="M55 88 C65 72 85 75 100 82 C115 75 135 72 145 88 C140 106 122 108 100 98 C78 108 60 106 55 88 Z" fill="#2563EB"/>
  <!-- Mask Eye Holes -->
  <ellipse cx="80" cy="90" rx="9" ry="6" fill="#FFFFFF"/>
  <ellipse cx="120" cy="90" rx="9" ry="6" fill="#FFFFFF"/>
  <!-- Pupils -->
  <circle cx="82" cy="90" r="4" fill="#0F172A"/>
  <circle cx="83" cy="89" r="1.5" fill="#FFFFFF"/>
  <circle cx="118" cy="90" r="4" fill="#0F172A"/>
  <circle cx="119" cy="89" r="1.5" fill="#FFFFFF"/>
  <!-- Confident Grin -->
  <path d="M88 120 Q100 130 112 120" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Spiky Hair -->
  <path d="M60 70 L72 50 L84 62 L100 45 L116 62 L128 50 L140 70 Z" fill="#0F172A"/>
</svg>
