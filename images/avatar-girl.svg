  <path d="M52 95 C52 50 72 40 100 40 C128 40 148 50 148 95 C135 75 115 72 100 75 C85 72 65 75 52 95 Z" fill="#7C2D12"/>
  <path d="M70 70 Q100 85 130 70 Q100 62 70 70 Z" fill="#9A3412"/>
