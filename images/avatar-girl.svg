  <polygon points="138,62 122,54 122,70" fill="#FB7185"/>
  <!-- Eyes -->
  <circle cx="82" cy="100" r="6.5" fill="#0F172A"/>
  <circle cx="84" cy="97" r="2.5" fill="#FFFFFF"/>
  <circle cx="118" cy="100" r="6.5" fill="#0F172A"/>
  <circle cx="120" cy="97" r="2.5" fill="#FFFFFF"/>
