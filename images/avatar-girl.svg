  <circle cx="100" cy="98" r="48" fill="url(#skinGirl)"/>
  <!-- Ears -->
  <circle cx="52" cy="100" r="10" fill="#FDBA74"/>
  <circle cx="148" cy="100" r="10" fill="#FDBA74"/>
