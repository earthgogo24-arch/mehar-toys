  <path d="M126 94 L130 90" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="72" cy="110" r="7" fill="#F43F5E" opacity="0.6"/>
